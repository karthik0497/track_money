<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="190" stroke="url(#brandGrad)" stroke-width="6" fill="none" opacity="0.35" />
  
  <!-- Outer Glow Card -->
  <rect x="96" y="140" width="320" height="200" rx="28" fill="#1e293b" stroke="url(#brandGrad)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Card Chip -->
  <rect x="136" y="180" width="50" height="38" rx="8" fill="#f59e0b" opacity="0.9" />
  <line x1="136" y1="199" x2="186" y2="199" stroke="#b45309" stroke-width="2"/>
  <line x1="161" y1="180" x2="161" y2="218" stroke="#b45309" stroke-width="2"/>

  <!-- AI Sparkles -->
  <path d="M360 170 L365 185 L380 190 L365 195 L360 210 L355 195 L340 190 L355 185 Z" fill="#10b981" />
  <path d="M385 215 L388 225 L398 228 L388 231 L385 241 L382 231 L372 228 L382 225 Z" fill="#6366f1" />

  <!-- Rupee Symbol -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#ffffff" text-anchor="middle">₹</text>

  <!-- Status Dots / Waves -->
  <circle cx="150" cy="300" r="6" fill="#10b981" />
  <circle cx="170" cy="300" r="6" fill="#6366f1" />
  <circle cx="190" cy="300" r="6" fill="#f43f5e" />
  
  <!-- AI Signal Arc -->
  <path d="M236 385 Q256 370 276 385" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M220 405 Q256 380 292 405" stroke="#6366f1" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M204 425 Q256 390 308 425" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" fill="none" />
</svg>
