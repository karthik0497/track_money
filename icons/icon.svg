<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radiant Yellow-Gold Master Gradient -->
    <linearGradient id="yellowMasterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Warm Amber Deep Gold Accent -->
    <linearGradient id="deepGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Obsidian Card Gradient -->
    <linearGradient id="obsidianCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#713f12" flood-opacity="0.35"/>
    </filter>

    <filter id="symbolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Yellow-Gold Gradient Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#yellowMasterGrad)" />

  <!-- Subtle Inner Golden Halo Ring -->
  <circle cx="256" cy="256" r="210" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" fill="none" />
  <circle cx="256" cy="256" r="190" stroke="url(#deepGoldGrad)" stroke-width="4" stroke-dasharray="12 8" fill="none" opacity="0.45" />

  <!-- Obsidian Jet-Black Premium Financial Card -->
  <rect x="92" y="132" width="328" height="212" rx="30" fill="url(#obsidianCardGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" filter="url(#cardShadow)"/>

  <!-- Card Top Gloss Light Reflection -->
  <path d="M94 162 Q94 134 122 134 L390 134 Q418 134 418 162 L418 186 Q256 160 94 192 Z" fill="#ffffff" opacity="0.08" />

  <!-- Metallic Gold Microchip -->
  <rect x="134" y="172" width="54" height="42" rx="10" fill="url(#yellowMasterGrad)" stroke="#a16207" stroke-width="1.5" />
  <line x1="134" y1="193" x2="188" y2="193" stroke="#854d0e" stroke-width="2"/>
  <line x1="161" y1="172" x2="161" y2="214" stroke="#854d0e" stroke-width="2"/>
  <circle cx="161" cy="193" r="4.5" fill="#ffffff" />

  <!-- AI Brilliant Gold Sparkle Stars -->
  <path d="M362 162 L369 179 L386 185 L369 191 L362 208 L355 191 L338 185 L355 179 Z" fill="#fef08a" filter="url(#symbolGlow)" />
  <path d="M388 208 L392 218 L402 221 L392 224 L388 234 L384 224 L374 221 L384 218 Z" fill="#facc15" />

  <!-- Prominent Central Rupee Symbol in Radiant Gold -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="86" fill="url(#yellowMasterGrad)" text-anchor="middle" filter="url(#symbolGlow)">₹</text>

  <!-- Accent Status Dots: Electric Yellow, Profit Green, Alert Red -->
  <circle cx="146" cy="306" r="7.5" fill="#facc15" />
  <circle cx="172" cy="306" r="7.5" fill="#22c55e" />
  <circle cx="198" cy="306" r="7.5" fill="#ef4444" />

  <!-- AI Radar / Audio Signal Waves in Gold -->
  <path d="M234 388 Q256 370 278 388" stroke="#18181c" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M214 410 Q256 382 298 410" stroke="#18181c" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M194 432 Q256 394 318 432" stroke="#18181c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55" />
</svg>
