<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Track-Money — AI-Powered Personal Finance</title>
  
  <!-- SEO Meta -->
  <meta name="description" content="AI-Powered Personal Finance & Expense Manager with Local Offline Database, Debit & Credit Portfolios, and Voice Conversational Assistant.">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Track-Money">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json?v=10">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=10">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=10">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css?v=10">
  <link rel="stylesheet" href="css/components.css?v=10">
  <link rel="stylesheet" href="css/dashboard.css?v=10">
  <link rel="stylesheet" href="css/assistant.css?v=10">
  <link rel="stylesheet" href="css/accounts.css?v=10">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('tm_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', savedTheme === 'light' ? '#f8fafc' : '#08080a');
    })();
  </script>
</head>
<body>
  <div id="app-root">
    <!-- Top Application Bar (Single AI Button) -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-icon-wrapper">
          <img src="icons/icon.svg?v=6" alt="Track-Money Logo">
        </div>
        <h1 class="brand-title">Track-Money</h1>
      </div>
      <div class="header-right">
        <button class="btn-install-header" id="header-install-btn" title="Install App" style="display: none;">
          📲 <span class="hide-on-mobile">Install</span>
        </button>
        <button class="btn btn-icon" id="header-voice-btn" title="AI Assistant" aria-label="AI Assistant">
          ✨
        </button>
        <button class="btn btn-icon" id="header-settings-btn" title="Settings" aria-label="Settings">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Main View Container -->
    <main class="app-main" id="app-main-view" role="main">
      <!-- Dynamically injected views -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" role="navigation" aria-label="Main Navigation">
      <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-item" data-view="accounts" id="nav-accounts">
        <span class="nav-icon">🏦</span>
        <span class="nav-label">Accounts</span>
      </button>
      <button class="nav-item" data-view="transactions" id="nav-transactions">
        <span class="nav-icon">📜</span>
        <span class="nav-label">History</span>
      </button>
      <button class="nav-item" data-view="reports" id="nav-reports">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Reports</span>
      </button>
    </nav>

    <!-- Slide-Up Quick Navigation & Actions Sheet -->
    <div class="more-sheet-backdrop" id="more-sheet-backdrop">
      <div class="more-sheet-card slide-up" id="more-sheet-card">
        <div class="more-sheet-header">
          <div class="flex-align-center" style="gap: 8px;">
            <h4 class="font-bold">More</h4>
          </div>
          <button class="btn btn-icon btn-sm" id="close-more-sheet">✕</button>
        </div>

        <div class="more-grid">
          <button class="more-menu-item" data-view="categories" id="nav-categories">
            <div class="more-icon-box" style="background: rgba(99, 102, 241, 0.15); color: #818cf8;">🏷️</div>
            <div class="more-text-col">
              <span class="more-title">Categories</span>
            </div>
            <span class="more-arrow">➔</span>
          </button>

          <button class="more-menu-item" data-view="recurring" id="nav-recurring">
            <div class="more-icon-box" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">🔄</div>
            <div class="more-text-col">
              <span class="more-title">Recurring</span>
            </div>
            <span class="more-arrow">➔</span>
          </button>

          <button class="more-menu-item" data-view="settings" id="nav-settings">
            <div class="more-icon-box" style="background: rgba(245, 158, 11, 0.15); color: #fbbf24;">⚙️</div>
            <div class="more-text-col">
              <span class="more-title">Settings</span>
            </div>
            <span class="more-arrow">➔</span>
          </button>

          <button class="more-menu-item" id="nav-install-app">
            <div class="more-icon-box" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">📲</div>
            <div class="more-text-col">
              <span class="more-title">Install</span>
            </div>
            <span class="more-arrow">➔</span>
          </button>
        </div>
      </div>
    </div>

    <!-- AI Assistant Drawer Container -->
    <div id="ai-assistant-container"></div>
  </div>

  <!-- Global Modal Root: Direct child of body so fixed backdrops cover 100% viewport and are never clipped -->
  <div id="global-modal-root"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
